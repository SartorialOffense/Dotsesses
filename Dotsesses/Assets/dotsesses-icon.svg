<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <!-- Gradient for the background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <!-- Glow filter for dots -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Rounded square background -->
  <rect x="32" y="32" width="960" height="960" rx="180" ry="180" fill="url(#bgGrad)"/>
  
  <!-- Decorative small dots scattered around -->
  <g opacity="0.4">
    <circle cx="150" cy="200" r="12" fill="#ff6b6b"/>
    <circle cx="874" cy="180" r="10" fill="#4ecdc4"/>
    <circle cx="120" cy="750" r="14" fill="#ffe66d"/>
    <circle cx="900" cy="820" r="11" fill="#95e1d3"/>
    <circle cx="200" cy="900" r="9" fill="#f38181"/>
    <circle cx="830" cy="280" r="13" fill="#aa96da"/>
    <circle cx="180" cy="450" r="8" fill="#fcbad3"/>
    <circle cx="850" cy="550" r="10" fill="#a8d8ea"/>
  </g>
  
  <!-- Main dot cluster - forming a loose "D" shape -->
  <g filter="url(#glow)">
    <!-- Large colorful dots -->
    <circle cx="300" cy="280" r="65" fill="#ff6b6b"/>
    <circle cx="300" cy="430" r="70" fill="#ff8e53"/>
    <circle cx="300" cy="590" r="68" fill="#ffe66d"/>
    <circle cx="300" cy="745" r="64" fill="#88d8b0"/>
    
    <!-- Curving dots forming the "D" bulge -->
    <circle cx="420" cy="200" r="55" fill="#4ecdc4"/>
    <circle cx="560" cy="220" r="60" fill="#45b7d1"/>
    <circle cx="680" cy="300" r="58" fill="#96ceb4"/>
    <circle cx="750" cy="420" r="62" fill="#a8e6cf"/>
    <circle cx="770" cy="560" r="60" fill="#88d8b0"/>
    <circle cx="720" cy="690" r="56" fill="#4ecdc4"/>
    <circle cx="620" cy="790" r="58" fill="#45b7d1"/>
    <circle cx="480" cy="840" r="54" fill="#aa96da"/>
    <circle cx="380" cy="860" r="50" fill="#dcd6f7"/>
    
    <!-- Interior accent dots -->
    <circle cx="450" cy="380" r="45" fill="#f38181"/>
    <circle cx="550" cy="450" r="50" fill="#fcbad3"/>
    <circle cx="500" cy="580" r="48" fill="#f9f7f7"/>
    <circle cx="580" cy="650" r="42" fill="#aa96da"/>
    <circle cx="420" cy="680" r="40" fill="#a8d8ea"/>
    <circle cx="450" cy="520" r="35" fill="#ffe66d"/>
  </g>
  
  <!-- Highlight dots for sparkle effect -->
  <g opacity="0.9">
    <circle cx="270" cy="250" r="15" fill="#ffffff"/>
    <circle cx="540" cy="200" r="12" fill="#ffffff"/>
    <circle cx="760" cy="400" r="14" fill="#ffffff"/>
    <circle cx="490" cy="560" r="10" fill="#ffffff"/>
  </g>
</svg>
